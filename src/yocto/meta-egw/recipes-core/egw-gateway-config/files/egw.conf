# EGW tmpfiles entries (installed as /usr/lib/tmpfiles.d/egw.conf by
# egw-gateway-config; applied by systemd-tmpfiles-setup at every boot).
#
# Persistent deployment and evidence tree on the ROOT file system, owned by
# the operator account (uid 1000 = the uid the controller container runs
# as, src/Dockerfile 'useradd --uid 1000 egw'). One guest layout is fixed
# here — /opt/egw/deployment is where 'scp -r src/deployment egw@…:/opt/egw/'
# lands — so that the README/collector examples (which still mention
# /opt/egw/src/deployment and /opt/egw/scripts) have one target to be
# aligned to.
#
# data/events is pre-created BECAUSE compose.yaml bind-mounts
# ./data/events into the controller: a bind-mount source that does not
# exist is created by dockerd as root:root, and the controller (uid 1000)
# then cannot write its events (PM item 3). 'd' creates missing parents and
# never changes an existing directory's contents; ownership/mode are
# (re)applied at each boot.
d /opt/egw                        0755 egw egw -
d /opt/egw/evidence               0755 egw egw -
d /opt/egw/deployment             0755 egw egw -
d /opt/egw/deployment/data        0755 egw egw -
d /opt/egw/deployment/data/events 0755 egw egw -
