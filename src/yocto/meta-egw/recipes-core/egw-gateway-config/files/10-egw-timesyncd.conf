# EGW time synchronisation (installed as
# /etc/systemd/timesyncd.conf.d/10-egw.conf; @EGW_NTP_SERVERS@ and
# @EGW_FALLBACK_NTP_SERVERS@ are substituted at build time from the
# egw-gateway-config recipe variables).
#
# Why the guest clock matters (audit 2026-09-17, section 4): the harness
# windows the 1 Hz resource/metrics samples by UTC wall-clock time and
# rejects a run whose SUT samples do not cover the measured window, the
# broker/controller TLS handshakes check certificate validity against the
# guest clock, and docker.service is ordered After=time-set.target. The
# primary latency metric is monotonic (ADR 0005) and unaffected.
#
# Order of precedence at run time: NTP servers offered by DHCP (networkd
# UseNTP=yes; runqemu slirp offers none), then NTP=, then FallbackNTP= (used
# only if nothing else is configured). Setting FallbackNTP= here makes the
# guest behaviour explicit whatever poky compiled in. Under slirp the guest
# reaches UDP/123 through the host NAT; acceptance: 'timedatectl show'
# reports NTPSynchronized=yes within a few minutes of boot.
[Time]
NTP=@EGW_NTP_SERVERS@
FallbackNTP=@EGW_FALLBACK_NTP_SERVERS@
