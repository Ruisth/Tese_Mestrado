# EGW sshd hardening (installed as /etc/ssh/sshd_config.d/10-egw.conf by
# egw-gateway-config). poky's sshd_config includes this directory on its
# line 13, before any default; sshd keeps the FIRST value it sees for a
# keyword, so these settings win even on egw-gateway-image-dev, where
# debug-tweaks rewrites the later PermitRootLogin/PermitEmptyPasswords
# lines of sshd_config to "yes".
#
# Plan v2.0 section 5 item 2 / PM item 3: SSH key access and controlled
# service access; no passwordless root on the integrated profile. The
# operator account 'egw' is created by egw-gateway-image.bb with an
# unusable (not locked) password field and the key from
# EGW_AUTHORIZED_KEYS_FILE.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
AllowUsers egw
X11Forwarding no
# Keep the harness's long-lived 'ssh -N -L 8000:127.0.0.1:8000' and
# 'ssh -L 8080:127.0.0.1:8080' tunnels alive across NAT/idle timeouts
# (server-side keepalive every 60 s, drop after 3 misses).
ClientAliveInterval 60
ClientAliveCountMax 3
