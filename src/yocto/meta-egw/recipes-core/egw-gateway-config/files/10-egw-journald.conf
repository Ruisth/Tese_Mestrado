# EGW journald policy (installed as /etc/systemd/journald.conf.d/10-egw.conf
# by egw-gateway-config). Overrides systemd-conf's
# /usr/lib/systemd/journald.conf.d/00-systemd-conf.conf (ForwardToSyslog=yes,
# RuntimeMaxUse=64M). Requires /var/log to be a real directory on the
# persistent root file system: egw-gateway-image.bb egw_persistent_var_log
# (EGW_PERSISTENT_VAR_LOG = "1") makes it one in the assembled rootfs
# without touching VOLATILE_LOG_DIR (kas manifest block 28 explains why);
# journald creates /var/log/journal/<machine-id> itself when
# Storage=persistent, after systemd-journal-flush.service.
[Journal]
Storage=persistent
# Hard cap on disk use by the system journal (boot, dockerd, containerd,
# sshd, timesyncd ...). Container stdout/stderr is NOT here: Docker keeps it
# in json-file logs bounded by daemon.json (50m x 3 per container) on the
# data disk.
SystemMaxUse=256M
SystemMaxFileSize=32M
RuntimeMaxUse=64M
MaxRetentionSec=1month
# journald is the only logger on this image (busybox-syslog is not
# installed: VIRTUAL-RUNTIME_base-utils-syslog is empty in the kas
# manifest); do not forward.
ForwardToSyslog=no
