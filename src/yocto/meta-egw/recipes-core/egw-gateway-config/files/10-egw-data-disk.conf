# EGW docker.service drop-in (installed as
# /usr/lib/systemd/system/docker.service.d/10-egw-data-disk.conf by
# egw-gateway-config).
#
# dockerd must never start before the persistent data disk is mounted on
# /var/lib/docker (fstab entry 'LABEL=egw-data /var/lib/docker ext4
# nofail,x-systemd.growfs,...' appended by egw-gateway-image.bb; disk file
# created on the host by scripts/run-qemu-integrated.sh). RequiresMountsFor
# adds Requires= and After= on var-lib-docker.mount, so a missing or
# unformatted disk makes docker.service fail visibly ('systemctl --failed')
# instead of silently filling the root file system. When no such mount
# unit exists (EGW_DOCKER_DATA_DISK = "0" in the image recipe), the
# directive resolves to the root mount and is a no-op.
[Unit]
RequiresMountsFor=/var/lib/docker
