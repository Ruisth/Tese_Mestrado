# meta-egw — C2DTA Edge Gateway layer (EGW-OS recipes and image).
# Compatible with Yocto Project 5.0 "Scarthgap" only; bump deliberately.

# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-egw"
BBFILE_PATTERN_meta-egw = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-egw = "10"

# 'core' = openembedded-core; 'virtualization-layer' = meta-virtualization
# (which itself depends on meta-oe, meta-python, meta-networking and
# meta-filesystems — all present in the kas manifest).
LAYERDEPENDS_meta-egw = "core virtualization-layer"

LAYERSERIES_COMPAT_meta-egw = "scarthgap"
