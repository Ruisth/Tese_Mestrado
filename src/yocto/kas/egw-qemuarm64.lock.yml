#                         + OpenEmbedded Layer Index API, agreeing)
#   meta-virtualization : scarthgap head, commit date 2026-08-07 (OpenEmbedded
#                         Layer Index API only — canonical cgit blocked
#                         automated fetches; confirm once on WSL2 with
#                         'git ls-remote https://git.yoctoproject.org/meta-virtualization scarthgap')
# meta-egw is local (part of this repository) and is not pinned here.

