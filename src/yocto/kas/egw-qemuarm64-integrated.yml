# kas manifest for the C2DTA Edge Gateway image (EGW-OS) — INTEGRATED
# QEMU/TCG test-gateway profile (PM work order 2026-09-17 items 1-3 and 5;
# ADR 0008 and plan v2.0 section 5 - the working revision of 2026-09-16,
# NOT yet published on dev, where plan v1.2 remains the published plan).
#
# Machine : qemuarm64 — the SAME machine, layers and pinned commits as the
#           gate-G1 manifest kas/egw-qemuarm64.yml. What differs: the image
#           (egw-gateway-image instead of egw-image), the build directory
#           (build-integrated/, selected with KAS_BUILD_DIR — see below),
#           a few headless trims, and the runqemu profile written into
#           <image>.qemuboot.conf (CPU model, memory, SMP, port forwards).
# Purpose : boot the Yocto ARM64 guest under QEMU/TCG on the x86-64 WSL2
#           host and run the full six-container stack INSIDE the guest,
#           with the simulator and the harness outside. This is ARM64
#           EMULATED ON AN x86-64 HOST: functional and integration
#           evidence only — never a statement about native ARM64
#           performance, and never "KVM" (no ARM64 KVM exists on an x86
#           host; QB_CPU_KVM below is inherited and unused here).
# Distro  : poky (Yocto Project 5.0.x "Scarthgap", LTS until April 2028)
# Image   : egw-gateway-image (meta-egw/recipes-core/images/); the
#           bring-up variant egw-gateway-image-dev is built with
#           'kas build kas/egw-qemuarm64-integrated.yml --target egw-gateway-image-dev'.
#
# THIS FILE DOES NOT REPLACE kas/egw-qemuarm64.yml. The G1 manifest, its
# lock file, egw-image.bb, egw-base-config, egw-container-smoke,
# scripts/build.sh, scripts/run-qemu.sh, scripts/boot_check.py and the
# sealed evidence under docs/evidence/g1-yocto-qemu/ stay byte-identical.
# G1 reproducibility (claim C01) remains bound to commit f0e19d5 and to
# build/; this profile never writes there.
#
# SEPARATE BUILD DIRECTORY (verified against kas 5.4 in WSL: kas/context.py
# line 85 'build_dir = os.environ.get("KAS_BUILD_DIR", <KAS_WORK_DIR>/build)';
# 'kas build --help' does NOT list the variable — it is an environment
# variable of every kas command, including 'kas shell'). Always run this
# manifest with KAS_BUILD_DIR pointing at src/yocto/build-integrated so that
# kas writes ITS local.conf/bblayers.conf and BitBake writes tmp/ there,
# leaving the G1 build/ (and its deploy directory) untouched.
# scripts/build-profile.sh and scripts/run-qemu-integrated.sh export it;
# by hand:
#     cd src/yocto
#     export KAS_WORK_DIR=$PWD KAS_BUILD_DIR=$PWD/build-integrated
#     export EGW_CACHE_DIR=$HOME/yocto-cache            # shared with G1
#     export EGW_AUTHORIZED_KEYS_FILE=$HOME/.ssh/egw_campaign.pub
#     kas build kas/egw-qemuarm64-integrated.yml
# DL_DIR and SSTATE_DIR come from EGW_CACHE_DIR (block 40 below), so every
# native, cross, allarch and target package whose task hashes are unchanged
# from G1 is restored from the shared sstate cache, not rebuilt.
# src/yocto/.gitignore (this change set) ignores /build-integrated/ and
# /build-genericarm64/ exactly like /build/, so 'git status' never lists
# the build tree and 'git add -A' cannot stage it.
#
# Requires kas >= 4.0 (configuration format version 14). Run from src/yocto
# so that the url-less meta-egw repo resolves.
#
# Revision pinning policy (plan section 4.3): IDENTICAL pins to
# egw-qemuarm64.yml (poky tag yocto-5.0.19 = bb98354685781296e3b3737e7762412100f359c2,
# meta-openembedded scarthgap ef3df29f2cfca6a9513b51ebcdccf82b6c8a836f,
# meta-virtualization scarthgap 0d9fb7fef86c5cbc177045c7b86bc71948f8657d).
# The provenance of each pin is documented in egw-qemuarm64.yml and
# repeated in egw-qemuarm64-integrated.lock.yml. To re-lock after a
# deliberate update (which must then also be applied to the G1 manifest
# or documented as a divergence):
#     kas dump --lock --inplace kas/egw-qemuarm64-integrated.yml

header:
  version: 14

env:
  # See egw-qemuarm64.yml for why the cache directory MUST come from the
  # environment (kas replaces HOME with a temporary directory before it
  # starts BitBake). scripts/build-profile.sh exports
  # EGW_CACHE_DIR=$HOME/yocto-cache, the same directory G1 uses.
  EGW_CACHE_DIR: "/var/tmp/egw-yocto-cache"
  # Absolute path, on the BUILD HOST, of the PUBLIC SSH key that becomes
  # /home/egw/.ssh/authorized_keys in the image (see egw-gateway-image.bb).
  # egw-gateway-image FAILS THE BUILD when this is empty (password
  # authentication is disabled and root is locked, so an image without a
  # key would be unreachable); egw-gateway-image-dev only warns, because
  # it has a root console for QEMU bring-up. Never commit a key into the
  # repository — export the variable in the shell that runs kas. kas hands
  # it to BitBake through BB_ENV_PASSTHROUGH_ADDITIONS (kas/libkas.py).
  EGW_AUTHORIZED_KEYS_FILE: ""

machine: qemuarm64
distro: poky
target: egw-gateway-image

repos:

  poky:
    url: https://git.yoctoproject.org/poky
    branch: scarthgap
    # Tag yocto-5.0.19 (Yocto Project 5.0.19 point release) — same pin as
    # egw-qemuarm64.yml.
    commit: bb98354685781296e3b3737e7762412100f359c2
    layers:
      meta:
      meta-poky:
      # meta-yocto-bsp is not needed: the qemuarm64 machine configuration
      # lives in openembedded-core (meta/conf/machine/qemuarm64.conf).

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: scarthgap
    commit: ef3df29f2cfca6a9513b51ebcdccf82b6c8a836f
    layers:
      # Dependency set required by meta-virtualization (see its README):
      meta-oe:
      meta-python:
      meta-networking:
      meta-filesystems:

  meta-virtualization:
    url: https://git.yoctoproject.org/meta-virtualization
    branch: scarthgap
    commit: 0d9fb7fef86c5cbc177045c7b86bc71948f8657d
    # Provides docker-moby (OCI runtime), containerd/runc/tini, the
    # docker-compose CLI plugin (recipes-containers/docker-compose/
    # docker-compose_git.bb, PV v2.26.0) and the linux-yocto kernel
    # configuration fragments for containers, activated by DISTRO_FEATURES
    # 'virtualization' (see local_conf_header below).

  meta-egw:
    # Local layer, part of this repository — no url on purpose. kas resolves
    # a url-less repo path relative to KAS_WORK_DIR (set it to src/yocto).
    # No 'layers' key: the repository root is the layer.
    path: meta-egw

local_conf_header:

  10-init-manager: |
    # systemd as the init system (plan 4.3: systemd + networking + OCI
    # runtime). In Scarthgap this include also adds the 'usrmerge' distro
    # feature (systemd requires it) via init-manager-systemd.inc.
    INIT_MANAGER = "systemd"

  20-distro-features: |
    # 'virtualization' switches on meta-virtualization's kernel
    # configuration fragments for linux-yocto (cgroups, namespaces,
    # overlayfs, netfilter — what containers need). 'systemd' is already
    # added by INIT_MANAGER above; the explicit append keeps the
    # requirement visible and duplicates are harmless. Identical to G1.
    DISTRO_FEATURES:append = " virtualization systemd"

  22-headless-trim: |
    # Features removed relative to G1. Rule applied: remove a feature only
    # when every consumer of it in the pinned layers (grep over poky/meta,
    # meta-oe, meta-networking, meta-python, meta-filesystems,
    # meta-virtualization, 2026-09-18) is a packagegroup, so that no task
    # hash of a recipe G1 built changes. What is verifiable, recipe by
    # recipe: the KERNEL (linux-yocto.inc lines 36-38 read MACHINE_FEATURES
    # only through bb.utils.contains on efi/numa/vfat, and DISTRO_FEATURES
    # through contains on ptest/virtualization — BitBake signs a contains()
    # check by the presence of the named item, not by the whole list),
    # the QEMU that boots the guest (qemu-system-native sees DISTRO_FEATURES
    # only through DISTRO_FEATURES_FILTER_NATIVE) and busybox (busybox.inc
    # reads only ipv4, ipv6, nls, bluetooth, wifi, systemd, sysvinit and
    # usrmerge from DISTRO_FEATURES — lines 74-80, 327, 349, 517 — never
    # MACHINE_FEATURES, and not the syslog provider variable of block 28;
    # none of those is removed) keep their G1 task hashes and come
    # back unchanged from the shared sstate cache. The guest therefore
    # runs the SAME 6.6.142 kernel binary and configuration the G1
    # evidence describes. No block of this manifest assigns a variable
    # that reaches every recipe's signature: block 28 deliberately avoids
    # VOLATILE_LOG_DIR and hostname:pn-base-files (sigdata evidence there).
    # Build acceptance (scripts/build-profile.sh prints both): keep
    # BitBake's closing 'Sstate summary:' line with the build evidence,
    # and compare 'sha256sum tmp/deploy/images/qemuarm64/Image' between
    # build/ (G1) and build-integrated/ — equal by prediction; a
    # different kernel Image means a variable reached the kernel's
    # signature and must be explained before a boot counts as evidence.
    # First-build work (no G1 stamps exist for them) is confined to
    # docker-compose, sudo, egw-gateway-config, the packagegroups that
    # read the features below and the two image recipes; curl, openssh,
    # e2fsprogs and util-linux were built by G1 and are restored.
    #
    #   nfs (DISTRO_FEATURES)
    #       -> packagegroup-base.bb: packagegroup-base-nfs = rpcbind (plus
    #          rpcbind.socket/.service, which listen on 111/tcp+udp on every
    #          guest interface — unnecessary exposure, PM item 3). Other
    #          consumers: packagegroup-core-full-cmdline.bb (not installed)
    #          and default-distrovars.inc (the default list itself).
    DISTRO_FEATURES:remove = "nfs"
    #   alsa (MACHINE_FEATURES; qemu.inc line 15 sets "alsa bluetooth
    #          usbgadget screen vfat")
    #       -> packagegroup-base.bb lines 17/57: packagegroup-base-alsa
    #          (alsa-utils-alsactl, alsa-utils-amixer, alsa-state). No
    #          sound device exists on this guest.
    #   bluetooth (MACHINE_FEATURES)
    #       -> packagegroup-base.bb line 64 (COMBINED_FEATURES needs the
    #          feature in BOTH lists) and lines 108-109 (ADD_BT needs
    #          pci/usbhost/pcmcia in MACHINE_FEATURES — qemuarm64 has none):
    #          packagegroup-base-bluetooth = bluez5 (6.9 MiB on G1) gone.
    #          The DISTRO feature is kept: busybox.inc line 80 (CONFIG_RFKILL)
    #          keys on it, and removing it would change the busybox
    #          configuration and hash.
    #   usbgadget (MACHINE_FEATURES)
    #       -> packagegroup-base.bb lines 25/62: packagegroup-base-usbgadget
    #          (kernel-module RRECOMMENDS only). No USB gadget controller.
    #   screen (MACHINE_FEATURES)
    #       -> image.bbclass line 63: SPLASH = psplash, used only when
    #          'splash' is in IMAGE_FEATURES (it is not). No package effect;
    #          removed to state the headless intent. QB_GRAPHICS is a
    #          runqemu variable and is not affected.
    MACHINE_FEATURES:remove = "alsa bluetooth usbgadget screen"
    # Kept on purpose, with the consumer that would otherwise change:
    #   vfat (MACHINE)   -> linux-yocto.inc line 38 adds cfg/fs/vfat.scc:
    #                       removing it changes the kernel configuration.
    #   ptest (DISTRO)   -> linux-yocto_6.6.bb lines 65-68 add scsi-debug,
    #                       nft_test, gpio mockup/sim and team fragments.
    #   opengl (DISTRO)  -> qemu-system-native_8.2.7.bb lines 12-14
    #                       (virglrenderer epoxy; DISTRO_FEATURES_FILTER_NATIVE
    #                       passes 'opengl' to native recipes): the QEMU
    #                       binary that boots the guest would be rebuilt.
    #   x11, wifi        -> systemd_255.21.bb lines 74-75 (PACKAGECONFIG
    #                       rfkill, xkbcommon), openssh, avahi, dbus and
    #                       many more recipes read them: removal would
    #                       rebuild systemd and its build-time dependants
    #                       for nothing, because on qemuarm64 they add no
    #                       package: packagegroup-base.bb adds wifi
    #                       packages only through COMBINED_FEATURES (line
    #                       65) or ADD_WIFI (lines 102-112, needs pci,
    #                       pcmcia or usbhost in MACHINE_FEATURES —
    #                       qemuarm64 has none), and no x11 packagegroup
    #                       (packagegroup-core-x11) is installed.
    #   zeroconf         -> systemd_255.21.bb line 257 (-Ddefault-mdns/
    #                       -Ddefault-llmnr): same rebuild. Removing it
    #                       would drop avahi-daemon (0.6 MiB, installed on
    #                       G1 through packagegroup-base-zeroconf), which
    #                       is harmless behind slirp; not worth a systemd
    #                       rebuild.
    #   bluetooth (DISTRO), alsa (DISTRO), pulseaudio, wayland, vulkan,
    #   3g, nfc, pcmcia, usbhost: no package they add is installed on
    #   qemuarm64 (MACHINE_FEATURES gates them), so removing them buys
    #   nothing and risks hash churn.

  28-system-config: |
    # PERSISTENT /var/log — done in the image, NOT with VOLATILE_LOG_DIR.
    # With the poky default ("yes", bitbake.conf line 91) base-files
    # installs /var/log as a symlink to the tmpfs /var/volatile/log
    # (base-files_3.0.14.bb lines 57 and 86-87) and the journal vanishes
    # on reboot. Setting VOLATILE_LOG_DIR = "no" here would defeat block
    # 22: bitbake.conf line 387 derives FILESYSTEM_PERMS_TABLES from it,
    # oe.package.fixup_perms (package.bbclass line 538, do_package) reads
    # that table, and the G1 signature data (build/tmp/stamps/*/<recipe>/
    # *.do_package.sigdata.*, zstd-compressed JSON) lists both
    # FILESYSTEM_PERMS_TABLES and VOLATILE_LOG_DIR in the varvals of every
    # target do_package checked (busybox, linux-yocto, systemd, dbus).
    # The variable would therefore invalidate do_package of EVERY target
    # recipe, and because do_package needs a do_install output that
    # build-integrated/ does not have, every target recipe — the kernel
    # included — would be fetched and compiled again; systemd, base-files
    # and initscripts read it in do_install as well (systemd_255.21.bb
    # line 314, base-files lines 46/57). A pn-scoped override on systemd
    # would still rebuild systemd and, through its do_populate_sysroot
    # hash, every recipe that DEPENDS on it (no hash equivalence to
    # absorb it: the G1 local.conf sets no BB_HASHSERVE and bitbake.conf
    # line 952 defaults BB_SIGNATURE_HANDLER to OEBasicHash).
    # The persistent log is therefore made by egw-gateway-image.bb
    # egw_persistent_var_log (ROOTFS_POSTPROCESS_COMMAND), which replaces
    # the /var/log symlink by a directory in the assembled rootfs and
    # pre-creates /var/log/journal. systemd's tmpfiles line 'L /var/log
    # - - - - /var/volatile/log' (00-create-volatile.conf) is then a
    # silent no-op (systemd 255.21 source in the G1 build tree,
    # src/tmpfiles/tmpfiles.c create_symlink line 2267: an existing path
    # that is not the wanted symlink returns 0 at log_debug level, line
    # 2318, unless 'L+' is used); 'z /var/log/journal 2755 root
    # systemd-journal' (tmpfiles.d/systemd.conf line 27 in the G1 rootfs)
    # sets the ownership at boot, and journald opens the persistent
    # journal after systemd-journal-flush.service (enabled in the G1
    # rootfs; journald-server.c lines 340-351 create
    # /var/log/journal/<machine-id>). The journald drop-in from
    # egw-gateway-config (Storage=persistent, SystemMaxUse=256M) bounds it
    # across reboots (PM item 3: services and event collection after a
    # guest reboot). Acceptance in the guest: 'ls -ld /var/log' is a
    # directory, 'journalctl --list-boots' lists the previous boot after
    # test 8. The image recipe defaults this to "1"; stated here so the
    # profile is explicit.
    EGW_PERSISTENT_VAR_LOG = "1"
    # journald is the only logger: drop busybox-syslog/klogd, otherwise
    # RRECOMMENDED by packagegroup-core-boot.bb line 38 through this
    # variable (default-providers.inc line 31), which would duplicate the
    # kernel and daemon lines into /var/log/messages. Read only by that
    # packagegroup and the initramfs-* recipes (not installed), never by
    # busybox itself, so no G1 package hash changes.
    VIRTUAL-RUNTIME_base-utils-syslog = ""
    # Recommendations not to install (package_rpm backend — the G1 build
    # and this manifest set no PACKAGE_CLASSES, testdata.json records
    # "PACKAGE_CLASSES": "package_rpm": oe/package_manager/rpm/__init__.py
    # lines 198-203 pass the names to 'dnf -x'; a hard RDEPENDS on an
    # excluded name would fail do_rootfs, and no installed package has
    # one — checked against the G1 pkgdata: kernel-image is only
    # RRECOMMENDED by kernel-base, shared-mime-info is RDEPENDed only by
    # glib-2.0-ptest / shared-mime-info-data / -staticdev, dosfstools only
    # by dosfstools-staticdev, none of them installed):
    #   kernel-image-6.6.142-yocto-standard
    #       The 24,150,528-byte kernel Image was installed into the G1
    #       rootfs (/boot/Image-6.6.142-yocto-standard) although runqemu
    #       passes the kernel from DEPLOY_DIR_IMAGE with -kernel and the
    #       rootfs copy is never read. Chain: IMAGE_INSTALL kernel-modules
    #       -> kernel-module-* RDEPENDS kernel-base -> kernel.bbclass line
    #       715 'RRECOMMENDS:kernel-base ?= kernel-image' (qemu.inc line 21
    #       blanks only RDEPENDS) -> kernel-image RDEPENDS kernel-image-image
    #       (the file). The runtime name is versioned by kernel.bbclass
    #       line 716 (PKG:kernel-image = kernel-image-<KERNEL_VERSION>) and
    #       is taken from the G1 manifest. This is deliberately done here,
    #       in the image feed, and NOT with a linux-yocto bbappend: a
    #       bbappend changing RRECOMMENDS would alter the kernel's
    #       do_package hash and rebuild the kernel. If the kernel pin ever
    #       changes, the name below silently stops matching: the build
    #       acceptance check 'grep ^kernel-image <image>.manifest' (must be
    #       empty) exists to catch exactly that.
    #   shared-mime-info (+libxml2, 4.2 MiB): RRECOMMENDS of glib-2.0, a
    #       desktop MIME database.
    #   dosfstools (0.3 MiB): RRECOMMENDS of packagegroup-base-vfat; no FAT
    #       volume is ever created on the guest (vfat stays in
    #       MACHINE_FEATURES only for the kernel fragment, see block 22).
    BAD_RECOMMENDATIONS += "kernel-image-6.6.142-yocto-standard shared-mime-info dosfstools"
    # Distinct guest identity for run provenance (collect-resources.sh and
    # capture-sut-environment.sh record the hostname; PM item 1: label the
    # environment explicitly as emulated). NOT the documented
    # 'hostname:pn-base-files' override (base-files_3.0.14.bb lines 67-69):
    # it changes base-files' do_install hash, and useradd.bbclass line 12
    # puts base-files into the DEPENDS of every target recipe that inherits
    # useradd (systemd, dbus, docker-moby ...), so the rebuild would
    # cascade through their do_populate_sysroot hashes. egw-gateway-image.bb
    # egw_set_hostname writes /etc/hostname and the '127.0.1.1' line of
    # /etc/hosts in the assembled rootfs instead — the two places
    # base-files_3.0.14.bb lines 113-116 fill with ${MACHINE} — and the
    # value is recorded in /etc/buildinfo (IMAGE_BUILDINFO_VARS).
    EGW_HOSTNAME = "egw-qemu-integrated"

  29-time-sync: |
    # NTP servers written into /etc/systemd/timesyncd.conf.d/10-egw.conf by
    # egw-gateway-config (space separated). Under runqemu 'slirp' the guest
    # reaches UDP/123 through the host's NAT; DHCP-supplied servers (slirp
    # offers none) would take precedence. Override here when the host
    # network requires an institutional server:
    # EGW_NTP_SERVERS = "ntp.example.org"

  30-parallelism: |
    # BitBake auto-detects the CPU count for BB_NUMBER_THREADS and
    # PARALLEL_MAKE — leave the defaults unless the WSL2 VM swaps or the
    # OOM killer triggers during the build. In that case cap BOTH to a
    # smaller value, for example:
    #   BB_NUMBER_THREADS = "4"
    #   PARALLEL_MAKE = "-j 4"
    # Rule of thumb: never set them above the vCPUs assigned to WSL2
    # (.wslconfig) and lower them when RAM per job is scarce. Never run a
    # build while the integrated guest is booted (block 50, memory).

  35-perl-parallel-make: |
    # Same workaround as egw-qemuarm64.yml (intermittent ExtUtils::MakeMaker
    # "Please rerun the make command" failure under parallel make, observed
    # 2026-08-10). PARALLEL_MAKE is excluded from sstate signatures.
    PARALLEL_MAKE:pn-perl = "-j 1"

  40-shared-caches: |
    # Keep downloads and shared state OUTSIDE the repository checkout so a
    # re-clone or 'git clean' never deletes them and rebuilds stay fast.
    # EGW_CACHE_DIR comes from the 'env:' block above — NEVER use ${HOME}
    # here: under kas it expands to a temporary directory (see the comment
    # on 'env:' in egw-qemuarm64.yml for the failure this caused). Sharing
    # the directory with the G1 target reuses every artefact whose task
    # hash is unchanged (this profile changes very few, see block 22).
    DL_DIR ?= "${EGW_CACHE_DIR}/downloads"
    SSTATE_DIR ?= "${EGW_CACHE_DIR}/sstate-cache"

  50-qemu-profile: |
    # runqemu profile for the INTEGRATED guest. qemuboot.bbclass writes
    # these into <image>-qemuarm64.rootfs.qemuboot.conf at image build time
    # and runqemu reads them; every value is therefore recorded with the
    # image (PM item 1: pin and record QEMU version, machine model, CPU,
    # memory, disk and boot parameters). QEMU is poky's qemu-system-native
    # 8.2.7 (the same binary G1 used; runqemu prints its full command line
    # into the console log at every boot). Machine model stays
    # QB_MACHINE = "-machine virt" from qemuarm64.conf.
    #
    # OVERRIDE SYNTAX MATTERS HERE. bitbake.conf includes conf/local.conf
    # BEFORE conf/machine/qemuarm64.conf, and qemuarm64.conf assigns QB_CPU
    # and QB_OPT_APPEND with a plain '=' (lines 17 and 22 of that file), so
    # a plain assignment in this block would be overwritten by the machine
    # file. The ':qemuarm64' suffix is a MACHINEOVERRIDES override
    # (bitbake.conf lines 811-816), applied when the variable is expanded,
    # and wins over the machine file's plain assignment. QB_SMP is '?=' in
    # qemuarm64.conf and QB_MEM is '?=' in qemuboot.bbclass (line 96), so
    # plain assignments would also work for them; the same syntax is used
    # for symmetry. QB_SLIRP_OPT is set nowhere else.
    #
    # CPU: cortex-a76 (ARMv8.2-A). MongoDB 7 on arm64 requires the
    # ARMv8.2-A microarchitecture (vendor production notes, quoted in plan
    # v2.0); the G1 profile's cortex-a57 is ARMv8.0-A, which is why the
    # full stack was never runnable in the G1 configuration. The poky-built
    # qemu-system-aarch64 8.2.7 lists cortex-a57, cortex-a76, neoverse-n1,
    # neoverse-n2, neoverse-v1 and max in '-cpu help' (target/arm/tcg/
    # cpu64.c line 1266 for cortex-a76). cortex-a76 rather than max: 'max'
    # is not a real core — it enables every feature QEMU can emulate, so
    # evidence would describe a CPU that exists nowhere — whereas cortex-a76
    # is a concrete ARMv8.2-A design, the model poky's own genericarm64.conf
    # uses for QB_CPU, and the core of the Raspberry Pi 5 named in the plan
    # as a possible physical target. The G1 kernel (tuned for cortexa57,
    # ARMv8.0-A code) runs unchanged on it. Acceptance: record 'lscpu' and
    # /proc/cpuinfo (CPU part 0xd0b) from inside the guest, and a MongoDB
    # start without an illegal-instruction abort.
    QB_CPU:qemuarm64 = "-cpu cortex-a76"
    # SMP: 4 vCPUs, the G1 value. QEMU 8.2.7 runs AArch64 guests with
    # multi-threaded TCG (target/arm/cpu.h line 31 defines
    # TCG_GUEST_DEFAULT_MO, which accel/tcg/tcg-all.c requires for
    # TARGET_SUPPORTS_MTTCG), so the four vCPUs execute on four host
    # threads. Do not exceed the physical cores left to WSL2 (.wslconfig
    # 'processors'); PM item 2 treats 4 vCPU / 8 GiB as a starting point
    # to validate in the pilot, not a guarantee.
    QB_SMP:qemuarm64 = "-smp 4"
    # Memory: 8192 MiB. runqemu check_mem (poky/scripts/runqemu lines
    # 820-845) derives BOTH the QEMU '-m 8192' and the kernel command-line
    # 'mem=8192M' from QB_MEM (the mem= suffix is added for every machine
    # except qemumips/qemux86/qemuloongarch64), so the G1 pair
    # '-m 256' + 'mem=256M' is replaced consistently in one place; a per-run
    # 'runqemu ... qemuparams="-m N"' also updates both. Sizing: the
    # compose memory limits sum to 2,432 MiB (mosquitto 128 + mongodb 512 +
    # 3 x ditto 512 + controller 256) plus dockerd/containerd, the kernel,
    # page cache for image extraction and MongoDB, and three JVMs starting
    # under emulation. WSL HEADROOM CAVEAT: the QEMU process can approach
    # 8 GiB RSS plus TCG translation caches; WSL2 gives the Linux VM 50 % of
    # the host RAM by default unless '[wsl2] memory=' is set in
    # %UserProfile%\.wslconfig. Check 'free -g' in WSL before booting (at
    # least 12 GiB free recommended), never run BitBake while the guest is
    # up, and confirm inside the guest with 'free -m' and 'nproc' (PM item
    # 2: confirm the memory and CPU features actually available).
    QB_MEM = "-m 8192"
    # User-mode networking ('runqemu ... slirp', setup_slirp at runqemu
    # lines 1107-1145). QB_SLIRP_OPT REPLACES runqemu's whole default
    # netdev string ("-netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22,
    # hostfwd=tcp:127.0.0.1:2323-:23,tftp=<DEPLOY_DIR_IMAGE>"):
    #   2222 -> 22   SSH for the operator (scp/sftp of the deployment tree
    #                and evidence; 'ssh -L' tunnels to the controller :8000
    #                and the Ditto gateway :8080, which compose.yaml binds
    #                to 127.0.0.1 inside the guest — forwarding a guest port
    #                does not expose a loopback-bound service, PM item 5).
    #   8883 -> 8883 MQTT/TLS: compose publishes mosquitto on all guest
    #                interfaces; the external simulator connects to
    #                127.0.0.1:8883 on the host with the dev CA and the
    #                certificate SAN IP:127.0.0.1 (generate-dev-tls.sh
    #                default SAN).
    #   dropped      2323->23 (no telnet daemon on the image) and 'tftp='
    #                (only serves DEPLOY_DIR_IMAGE to the guest for network
    #                boot; the kernel is passed with -kernel, and runqemu
    #                substitutes @DEPLOY_DIR_IMAGE@ only in QB_OPT_APPEND,
    #                line 1540, never in QB_SLIRP_OPT, so the path could not
    #                be kept generic anyway).
    # Both forwards bind to the host's 127.0.0.1 only. runqemu re-maps a
    # host port that is already in use and logs 'Port forward changed:
    # 8883 -> 8884' — read the printed mapping before pointing the
    # simulator or ssh at a port (scripts/run-qemu-integrated.sh checks
    # both ports with 'ss -ltn' first). MongoDB (27017) and the Ditto
    # devops interface are not forwarded and stay unreachable from outside.
    QB_SLIRP_OPT = "-netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22,hostfwd=tcp:127.0.0.1:8883-:8883"
    # qemuarm64.conf line 22 appends '-device qemu-xhci -device usb-tablet
    # -device usb-kbd', input devices for the virtio-gpu console. The
    # guest is driven over the serial console ('nographic') and SSH, so
    # they are dropped; nothing else in the pinned layers reads
    # QB_OPT_APPEND. Reversible per run with qemuparams=.
    QB_OPT_APPEND:qemuarm64 = ""
    #
    # STORAGE: a SECOND persistent virtio disk for /var/lib/docker (image
    # layers under overlay2, the mosquitto-data and mongodb-data named
    # volumes under volumes/, and the json-file container logs) was chosen
    # over inflating IMAGE_ROOTFS_EXTRA_SPACE. Reasons: (1) runqemu boots
    # the deployed rootfs .ext4 IN PLACE (no -snapshot), so container state
    # written into the root file system would sit inside a build artefact,
    # be overwritten by every rebuild and turn a 20+ GiB .ext4 into a
    # deploy-directory file; (2) the data disk is one file that is sized,
    # grown (truncate on the host + x-systemd.growfs in the guest), reset
    # (recreate the file = a destructive reset limited to identified test
    # volumes, PM item 8) and checksummed independently of the image, so
    # "guest reboot" and "stack restart" tests exercise real persistence;
    # (3) the rootfs keeps the G1 headroom (2 GiB) for /opt/egw (deployment
    # tree, events, image archives) and the bounded journal.
    # The disk file lives OUTSIDE the repository — default
    # $HOME/yocto/egw-integrated/egw-data.img, created sparse (32 GiB) and
    # formatted ext4 with label 'egw-data' by scripts/run-qemu-integrated.sh
    # — and is attached PER RUN with
    #   runqemu ... qemuparams="-drive id=disk1,file=<path>,if=none,format=raw -device virtio-blk-pci,drive=disk1"
    # rather than through QB_OPT_APPEND: qemuboot.conf is written at build
    # time and would have to carry an absolute host path (the only
    # substitution runqemu performs in QB_OPT_APPEND is @DEPLOY_DIR_IMAGE@,
    # which is inside the build directory). Guest side: egw-gateway-image.bb
    # appends 'LABEL=egw-data /var/lib/docker ext4 nofail,x-systemd.growfs'
    # to /etc/fstab, and egw-gateway-config's docker.service drop-in sets
    # RequiresMountsFor=/var/lib/docker, so dockerd never starts on the root
    # file system by accident when the disk is missing (docker.service then
    # fails visibly; the boot itself continues and SSH stays up).
    # Grow later with 'truncate -s 64G <path>' on the host: systemd-growfs
    # resizes the file system at the next boot.
