[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "egw"
version = "0.1.0"
description = "Digital Twin Edge Gateway (C2DTA Tema 1): unified wearable simulator, MQTT-to-Ditto controller and experiment harness"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.1,<3",
    "jsonschema>=4.21",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
analysis = [
    "pandas>=2.2",
    "matplotlib>=3.9",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.setuptools]
packages = ["egw_simulator", "egw_controller", "egw_experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: requires a live Mosquitto/Ditto stack (deselected by default via addopts; run with -m integration)",
]
