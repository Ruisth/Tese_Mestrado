# mosquitto.conf — EGW broker configuration (CONTRACTS.md §1, plan §5.2).
#
# Mounted read-only at /mosquitto/config/mosquitto.conf by compose.yaml.
# Single TLS listener on 8883; no anonymous access; username/password +
# per-user ACL; persistence and evidence-grade connection/subscribe logging.

# ---------------------------------------------------------------------------
# Listener: MQTT over TLS on 8883 (the only externally published port of the
# stack). Server-authentication only: clients verify the broker against the
# dev CA; client certificates are NOT required (auth is username/password).
# ---------------------------------------------------------------------------
listener 8883 0.0.0.0
protocol mqtt
cafile /mosquitto/config/certs/ca.crt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
require_certificate false
tls_version tlsv1.2

# ---------------------------------------------------------------------------
# Authentication and authorization (CONTRACTS.md §1: anonymous access is
# forbidden; egw-simulator may only publish under c2dt/#, egw-controller may
# only subscribe/read).
# ---------------------------------------------------------------------------
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# ---------------------------------------------------------------------------
# Persistence: QoS 1 in-flight/queued state survives broker restarts
# (dropout-reconnect scenario). Backed by the mosquitto-data named volume.
# ---------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# ---------------------------------------------------------------------------
# Window, queue and session expiry (ADR 0011, condition C1; decided
# 2026-09-24). The controller acknowledges each QoS 1 delivery only after its
# outcome line is written, on a persistent session, so the broker holds the
# in-flight window and the queue of an absent controller. In Mosquitto 2.0.22
# every option below applies globally (no per-listener or per-client form) and
# is reloaded on the reload signal: a run record states that no reload
# happened. The values are the candidate's configuration, exercised by the
# broker measurement of 2026-09-23, not a validated capacity or expiry.
# ---------------------------------------------------------------------------
max_inflight_messages 4999
max_inflight_bytes 0
max_queued_messages 1000
max_queued_bytes 0
persistent_client_expiration 1h
sys_interval 10

# ---------------------------------------------------------------------------
# Logging (evidence): connection, disconnection, subscribe and unsubscribe
# events with ISO-8601-style timestamps, written to stdout so `docker logs`
# captures them into the run evidence (plan §5.8).
#
# NOTE for analysis: the compose healthcheck probes the listener every 30 s
# with client id "egw-healthcheck" and an invalid user; those "not
# authorised" lines are expected and must be filtered out of
# connection-evidence counts.
# ---------------------------------------------------------------------------
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
