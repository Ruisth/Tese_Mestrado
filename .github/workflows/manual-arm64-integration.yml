name: manual-arm64-integration-gate

on:
  workflow_dispatch:
    inputs:
      evidence_label:
        description: Unique evidence label, for example g2-vertical-slice-01
        required: true
        type: string

permissions:
  contents: read

jobs:
  live-integration:
    name: Native ARM64 live integration
    runs-on: [self-hosted, linux, ARM64, egw-integration]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify native ARM64 host
        run: test "$(uname -m)" = aarch64
      - name: Capture the system under test
        working-directory: src/deployment
        run: scripts/capture-sut-environment.sh "${{ runner.temp }}/${{ inputs.evidence_label }}-sut_environment.json"
      # The controller is never built by Compose: compose.yaml carries no
      # "build:" for it and pull_policy is never. On this native ARM64 runner
      # the provisioning script builds and loads it before the stack starts.
      - name: Build and load the controller image
        run: |
          sh src/deployment/scripts/build-controller-image.sh "${{ runner.temp }}/images"
          docker load -i "${{ runner.temp }}/images/egw-controller-0.1.0-arm64.tar"
      - name: Verify the loaded controller image against its record
        working-directory: src/deployment/scripts
        run: sh verify-controller-image.sh "${{ runner.temp }}/images/egw-controller-0.1.0-arm64.identity.txt"
      - name: Validate local secrets, pins and Compose configuration
        working-directory: src/deployment
        run: scripts/validate-config.sh
      - name: Start the stack and wait for readiness
        working-directory: src/deployment
        run: |
          docker compose --env-file .env --env-file images.lock.env up -d
          timeout 600 sh -c 'until curl -fsS http://127.0.0.1:8000/ready >/dev/null; do sleep 5; done'
      - name: Install integration-test dependencies
        working-directory: src
        run: python3 -m pip install -e '.[dev,analysis]'
      - name: Run live integration tests
        working-directory: src
        run: python3 -m pytest tests -q -m integration
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.evidence_label }}
          path: ${{ runner.temp }}/${{ inputs.evidence_label }}-sut_environment.json
          if-no-files-found: error
